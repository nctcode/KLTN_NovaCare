<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1720" viewBox="0 0 1440 1720">
  <defs>
    <style>
      .lifeline-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .lifeline-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .msg { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16.5px; font-weight: 600; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .guard { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .frag-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; }
      .lifeline { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .act { fill: #7DD3FC; stroke: #0f172a; stroke-width: 1.6; }
      .arrow { stroke: #0f172a; stroke-width: 2px; fill: none; }
      .ret { stroke: #0f172a; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
      .frag-box { fill: none; stroke: #1e293b; stroke-width: 2; }
      .frag-div { stroke: #1e293b; stroke-width: 1.6; stroke-dasharray: 8 5; }
      .icon-fill { fill: #7DD3FC; stroke: #0f172a; stroke-width: 2; }
      .icon-stroke { fill: none; stroke: #0f172a; stroke-width: 2; }
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- Crisp White Background -->
  <rect x="0" y="0" width="1440" height="1720" fill="#FFFFFF"/>

  <!-- Diagram Frame -->
  <rect x="14" y="14" width="1412" height="1692" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="14,14 340,14 340,46 322,62 14,62" fill="#F1F5F9" stroke="#64748b" stroke-width="1.6"/>
  <text x="30" y="45" class="frag-tag" style="font-size:17.5px;">sd Đăng nhập (NovaCare)</text>

  <!-- ================= LIFELINE HEADERS ================= -->
  <!-- X positions: Actor=115, GD_TrangChu=340, GD_DangNhap=590, CTR_AuthService=880, E_users=1135, E_refresh_tokens=1335 -->

  <!-- 1. Actor: Người dùng -->
  <g transform="translate(115, 114)">
    <circle cx="0" cy="-18" r="12" class="icon-fill"/>
    <line x1="0" y1="-6" x2="0" y2="20" class="icon-stroke"/>
    <line x1="-18" y1="3" x2="18" y2="3" class="icon-stroke"/>
    <line x1="0" y1="20" x2="-14" y2="38" class="icon-stroke"/>
    <line x1="0" y1="20" x2="14" y2="38" class="icon-stroke"/>
    <text x="0" y="62" class="lifeline-label">Người dùng</text>
    <text x="0" y="80" class="lifeline-sub">(PATIENT / DOCTOR /</text>
    <text x="0" y="96" class="lifeline-sub">ADMIN / HOSPITAL_ADMIN)</text>
  </g>
  <line x1="115" y1="220" x2="115" y2="1685" class="lifeline"/>

  <!-- 2. Boundary: GD_TrangChu -->
  <g transform="translate(340, 126)">
    <line x1="-30" y1="-19" x2="-30" y2="19" class="icon-stroke"/>
    <line x1="-30" y1="0" x2="-18" y2="0" class="icon-stroke"/>
    <circle cx="3" cy="0" r="21" class="icon-fill"/>
    <text x="0" y="48" class="lifeline-label">GD_TrangChu</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;boundary&gt;&gt;</text>
  </g>
  <line x1="340" y1="220" x2="340" y2="1685" class="lifeline"/>

  <!-- 3. Boundary: GD_DangNhap -->
  <g transform="translate(590, 126)">
    <line x1="-30" y1="-19" x2="-30" y2="19" class="icon-stroke"/>
    <line x1="-30" y1="0" x2="-18" y2="0" class="icon-stroke"/>
    <circle cx="3" cy="0" r="21" class="icon-fill"/>
    <text x="0" y="48" class="lifeline-label">GD_DangNhap</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;boundary&gt;&gt;</text>
  </g>
  <line x1="590" y1="220" x2="590" y2="1685" class="lifeline"/>

  <!-- 4. Control: CTR_AuthService -->
  <g transform="translate(880, 126)">
    <circle cx="0" cy="0" r="21" class="icon-fill"/>
    <path d="M -5,-27 L 5,-21 L -5,-15" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="48" class="lifeline-label">CTR_AuthService</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;control&gt;&gt;</text>
  </g>
  <line x1="880" y1="220" x2="880" y2="1685" class="lifeline"/>

  <!-- 5. Entity: E_users -->
  <g transform="translate(1135, 126)">
    <circle cx="0" cy="-2" r="21" class="icon-fill"/>
    <line x1="-23" y1="21" x2="23" y2="21" class="icon-stroke"/>
    <text x="0" y="48" class="lifeline-label">E_users</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="1135" y1="220" x2="1135" y2="1685" class="lifeline"/>

  <!-- 6. Entity: E_refresh_tokens -->
  <g transform="translate(1335, 126)">
    <circle cx="0" cy="-2" r="21" class="icon-fill"/>
    <line x1="-23" y1="21" x2="23" y2="21" class="icon-stroke"/>
    <text x="0" y="48" class="lifeline-label">E_refresh_tokens</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="1335" y1="220" x2="1335" y2="1685" class="lifeline"/>

  <!-- ================= ACTIVATION BARS ================= -->
  <!-- Actor -->
  <rect x="107" y="242" width="16" height="1420" class="act"/>

  <!-- GD_TrangChu -->
  <rect x="332" y="256" width="16" height="72" class="act"/>
  <rect x="332" y="1142" width="16" height="50" class="act"/>

  <!-- GD_DangNhap -->
  <rect x="582" y="294" width="16" height="1335" class="act"/>
  <rect x="590" y="454" width="14" height="28" class="act"/>
  <rect x="590" y="1090" width="14" height="26" class="act"/>
  <rect x="590" y="1316" width="14" height="26" class="act"/>
  <rect x="590" y="1464" width="14" height="26" class="act"/>
  <rect x="590" y="1576" width="14" height="26" class="act"/>

  <!-- CTR_AuthService -->
  <rect x="872" y="574" width="16" height="878" class="act"/>
  <rect x="880" y="728" width="14" height="28" class="act"/>
  <rect x="880" y="886" width="14" height="28" class="act"/>

  <!-- E_users -->
  <rect x="1127" y="630" width="16" height="58" class="act"/>
  <rect x="1127" y="818" width="16" height="44" class="act"/>

  <!-- E_refresh_tokens -->
  <rect x="1327" y="962" width="16" height="46" class="act"/>

  <!-- ================= MESSAGES (MAIN FLOW TOP) ================= -->
  <line x1="123" y1="258" x2="332" y2="258" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="134" y="249" class="msg">1: Chọn "Đăng nhập"</text>

  <line x1="348" y1="296" x2="582" y2="296" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="360" y="287" class="msg">1.1: showLoginForm()</text>

  <line x1="123" y1="358" x2="582" y2="358" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="136" y="349" class="msg">2: Nhập username (email / phone) và password</text>

  <line x1="123" y1="408" x2="582" y2="408" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="136" y="399" class="msg">3: Chọn nút "Đăng nhập"</text>

  <path d="M 598 436 L 646 436 L 646 462 L 604 462" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="656" y="454" class="msg">3.1: validate(username, password)</text>

  <!-- ================= OUTER ALT: VALIDATE INPUT ================= -->
  <rect x="34" y="504" width="1372" height="1172" class="frag-box"/>
  <polygon points="34,504 102,504 102,528 88,540 34,540" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="52" y="528" class="frag-tag">alt</text>
  <text x="136" y="530" class="guard">[username != "" &amp;&amp; password != ""]</text>

  <line x1="598" y1="576" x2="872" y2="576" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="610" y="566" class="msg">4: login(LoginDto { username,</text>
  <text x="628" y="596" class="msg">password })</text>

  <line x1="888" y1="632" x2="1127" y2="632" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="898" y="610" class="msg">4.1: findFirst(email, phone,</text>
  <text x="920" y="627" class="msg">deletedAt = null)</text>

  <line x1="1127" y1="688" x2="888" y2="688" class="ret" marker-end="url(#openArrow)"/>
  <text x="898" y="666" class="msg">4.2: user (id, passwordHash,</text>
  <text x="920" y="683" class="msg">role, isActive)</text>

  <path d="M 888 716 L 936 716 L 936 742 L 894 742" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="946" y="726" class="msg">4.3: argon2.verify(user.passwordHash,</text>
  <text x="976" y="746" class="msg">password) &amp; check user.isActive</text>

  <!-- ================= INNER ALT: AUTHENTICATION RESULT ================= -->
  <rect x="60" y="766" width="1322" height="752" class="frag-box"/>
  <polygon points="60,766 128,766 128,790 114,802 60,802" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="78" y="790" class="frag-tag">alt</text>
  <text x="136" y="792" class="guard">[user != null &amp;&amp; user.isActive == true &amp;&amp; isPasswordValid == true]</text>

  <line x1="888" y1="822" x2="1127" y2="822" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="898" y="813" class="msg">4.4: update(id, lastLoginAt)</text>

  <line x1="1127" y1="862" x2="888" y2="862" class="ret" marker-end="url(#openArrow)"/>
  <text x="940" y="854" class="msg">4.5: updatedUser</text>

  <path d="M 888 878 L 936 878 L 936 904 L 894 904" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="946" y="888" class="msg">4.6: generateTokens(user) &amp;</text>
  <text x="976" y="908" class="msg">hashToken(refreshToken)</text>

  <line x1="888" y1="964" x2="1327" y2="964" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="900" y="954" class="msg">4.7: create({ userId, tokenHash, expiresAt })</text>

  <line x1="1327" y1="1008" x2="888" y2="1008" class="ret" marker-end="url(#openArrow)"/>
  <text x="1110" y="999" class="msg">4.8: savedRefreshToken</text>

  <line x1="872" y1="1058" x2="598" y2="1058" class="ret" marker-end="url(#openArrow)"/>
  <text x="610" y="1036" class="msg">5: AuthResponse { accessToken,</text>
  <text x="628" y="1053" class="msg">refreshToken, expiresIn, user }</text>

  <path d="M 598 1078 L 646 1078 L 646 1104 L 604 1104" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="656" y="1097" class="msg">5.1: showToast("Đăng nhập thành công")</text>

  <line x1="582" y1="1148" x2="348" y2="1148" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="358" y="1139" class="msg">5.2: navigateByRole(user.role)</text>

  <!-- DIVIDER: [!user || !isPasswordValid] (Luồng 3.2) -->
  <line x1="60" y1="1216" x2="1382" y2="1216" class="frag-div"/>
  <text x="136" y="1244" class="guard">[user == null || isPasswordValid == false — Luồng 3.2]</text>

  <line x1="872" y1="1286" x2="598" y2="1286" class="ret" marker-end="url(#openArrow)"/>
  <text x="612" y="1276" class="msg">6: UnauthorizedException (401)</text>

  <path d="M 598 1304 L 646 1304 L 646 1330 L 604 1330" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="656" y="1323" class="msg">6.1: showError("Tài khoản không tồn tại hoặc sai mật khẩu")</text>

  <path d="M 123 1354 L 172 1354 L 172 1380 L 123 1380" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="184" y="1373" class="msg">6.2: Quay lại bước 2 (Nhập lại username &amp; password)</text>

  <!-- DIVIDER: [!user.isActive] (Luồng 3.3) -->
  <line x1="60" y1="1398" x2="1382" y2="1398" class="frag-div"/>
  <text x="136" y="1424" class="guard">[user.isActive == false — Luồng 3.3]</text>

  <line x1="872" y1="1450" x2="598" y2="1450" class="ret" marker-end="url(#openArrow)"/>
  <text x="612" y="1441" class="msg">7: UnauthorizedException (401)</text>

  <path d="M 598 1462 L 646 1462 L 646 1488 L 604 1488" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="656" y="1481" class="msg">7.1: showError("Tài khoản đã bị khóa")</text>

  <!-- ================= OUTER ALT DIVIDER: EMPTY INPUT (Luồng 3.1) ================= -->
  <line x1="34" y1="1534" x2="1406" y2="1534" class="frag-div"/>
  <text x="136" y="1560" class="guard">[username == "" || password == "" — Luồng 3.1]</text>

  <path d="M 598 1572 L 646 1572 L 646 1598 L 604 1598" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="656" y="1591" class="msg">8: showError("Vui lòng điền đầy đủ thông tin hợp lệ")</text>

  <path d="M 123 1622 L 172 1622 L 172 1648 L 123 1648" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="184" y="1641" class="msg">8.1: Quay lại bước 2 (Nhập lại username &amp; password)</text>
</svg>
