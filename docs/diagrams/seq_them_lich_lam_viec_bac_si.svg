<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1860" viewBox="0 0 1600 1860">
  <defs>
    <style>
      .lifeline-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .lifeline-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.4px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .msg { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.8px; font-weight: 600; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .guard { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.8px; font-weight: 800; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .frag-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; }
      .lifeline { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .act { fill: #7DD3FC; stroke: #0f172a; stroke-width: 1.6; }
      .arrow { stroke: #0f172a; stroke-width: 2.1px; fill: none; }
      .ret { stroke: #0f172a; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
      .frag-box { fill: none; stroke: #1e293b; stroke-width: 2; }
      .frag-div { stroke: #1e293b; stroke-width: 1.6; stroke-dasharray: 8 5; }
      .icon-fill { fill: #7DD3FC; stroke: #0f172a; stroke-width: 2; }
      .icon-stroke { fill: none; stroke: #0f172a; stroke-width: 2; }
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- White Background -->
  <rect x="0" y="0" width="1600" height="1860" fill="#FFFFFF"/>

  <!-- Frame -->
  <rect x="14" y="14" width="1572" height="1832" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="14,14 480,14 480,46 462,62 14,62" fill="#F1F5F9" stroke="#64748b" stroke-width="1.6"/>
  <text x="30" y="45" class="frag-tag" style="font-size:17px;">sd Thêm lịch làm việc bác sĩ (NovaCare)</text>

  <!-- ================= LIFELINES (5 top + dynamic ObjSchedule_new at x=895) ================= -->
  <!-- X: Admin=90, GD=340, CTR=630, [ObjSchedule_new=895], E_doctors=1140, E_doctor_schedules=1385 -->

  <!-- 1. Actor: Quản trị viên cơ sở y tế -->
  <g transform="translate(90, 110)">
    <circle cx="0" cy="-18" r="12" class="icon-fill"/>
    <line x1="0" y1="-6" x2="0" y2="20" class="icon-stroke"/>
    <line x1="-18" y1="3" x2="18" y2="3" class="icon-stroke"/>
    <line x1="0" y1="20" x2="-14" y2="38" class="icon-stroke"/>
    <line x1="0" y1="20" x2="14" y2="38" class="icon-stroke"/>
    <text x="0" y="55" class="lifeline-label">Quản trị viên</text>
    <text x="0" y="72" class="lifeline-label">cơ sở y tế</text>
    <text x="0" y="88" class="lifeline-sub">(HOSPITAL_ADMIN)</text>
  </g>
  <line x1="90" y1="208" x2="90" y2="1820" class="lifeline"/>

  <!-- 2. Boundary: GD_ThemLichLamViec -->
  <g transform="translate(340, 124)">
    <line x1="-29" y1="-19" x2="-29" y2="19" class="icon-stroke"/>
    <line x1="-29" y1="0" x2="-17" y2="0" class="icon-stroke"/>
    <circle cx="3" cy="0" r="20" class="icon-fill"/>
    <text x="0" y="45" class="lifeline-label">GD_ThemLich</text>
    <text x="0" y="62" class="lifeline-label">LamViec</text>
    <text x="0" y="78" class="lifeline-sub">&lt;&lt;boundary&gt;&gt;</text>
  </g>
  <line x1="340" y1="208" x2="340" y2="1820" class="lifeline"/>

  <!-- 3. Control: CTR_AdminDoctorsService -->
  <g transform="translate(630, 124)">
    <circle cx="0" cy="0" r="20" class="icon-fill"/>
    <path d="M -5,-26 L 5,-20 L -5,-14" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="45" class="lifeline-label">CTR_AdminDoctors</text>
    <text x="0" y="62" class="lifeline-label">Service</text>
    <text x="0" y="78" class="lifeline-sub">&lt;&lt;control&gt;&gt;</text>
  </g>
  <line x1="630" y1="208" x2="630" y2="1820" class="lifeline"/>

  <!-- 4. Entity: E_doctors -->
  <g transform="translate(1140, 124)">
    <circle cx="0" cy="-2" r="20" class="icon-fill"/>
    <line x1="-22" y1="20" x2="22" y2="20" class="icon-stroke"/>
    <text x="0" y="48" class="lifeline-label">E_doctors</text>
    <text x="0" y="66" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="1140" y1="208" x2="1140" y2="1820" class="lifeline"/>

  <!-- 5. Entity: E_doctor_schedules -->
  <g transform="translate(1385, 124)">
    <circle cx="0" cy="-2" r="20" class="icon-fill"/>
    <line x1="-22" y1="20" x2="22" y2="20" class="icon-stroke"/>
    <text x="0" y="45" class="lifeline-label">E_doctor_</text>
    <text x="0" y="62" class="lifeline-label">schedules</text>
    <text x="0" y="78" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="1385" y1="208" x2="1385" y2="1820" class="lifeline"/>

  <!-- ================= ACTIVATION BARS ================= -->
  <!-- Actor -->
  <rect x="82" y="234" width="16" height="1548" class="act"/>

  <!-- GD_ThemLichLamViec -->
  <rect x="332" y="248" width="16" height="1526" class="act"/>
  <rect x="340" y="604" width="14" height="24" class="act"/>
  <rect x="340" y="968" width="14" height="24" class="act"/>

  <!-- CTR_AdminDoctorsService -->
  <rect x="622" y="294" width="16" height="176" class="act"/>
  <rect x="622" y="1104" width="16" height="414" class="act"/>

  <!-- E_doctors -->
  <rect x="1132" y="344" width="16" height="68" class="act"/>

  <!-- E_doctor_schedules -->
  <rect x="1377" y="1314" width="16" height="132" class="act"/>
  <rect x="1385" y="1344" width="14" height="24" class="act"/>

  <!-- ================= PHASE 1: MỞ BIỂU MẪU & CHỌN BÁC SĨ (Steps 1 - 3) ================= -->
  <line x1="98" y1="250" x2="332" y2="250" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="110" y="240" class="msg">1: Nhấn nút "Thêm ca khám" tại trang "Lịch trực &amp; Ca khám"</text>

  <line x1="348" y1="296" x2="622" y2="296" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="364" y="286" class="msg">1.1: findAll(hospitalId, isActive=true)</text>

  <line x1="638" y1="346" x2="1132" y2="346" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="750" y="336" class="msg">1.2: findMany(hospitalId, isActive=true)</text>

  <line x1="1132" y1="408" x2="638" y2="408" class="ret" marker-end="url(#openArrow)"/>
  <text x="675" y="398" class="msg">1.3: Trả về danh sách chuyên khoa, bác sĩ &amp; lịch hiện có</text>

  <line x1="622" y1="466" x2="348" y2="466" class="ret" marker-end="url(#openArrow)"/>
  <text x="364" y="456" class="msg">1.4: Trả về danh sách bác sĩ của cơ sở</text>

  <line x1="332" y1="522" x2="98" y2="522" class="ret" marker-end="url(#openArrow)"/>
  <text x="110" y="512" class="msg">1.5: Mở hộp thoại "Thêm Ca Khám Định Kỳ Cho Bác Sĩ" (cố định tên cơ sở y tế của quản trị viên)</text>

  <line x1="98" y1="576" x2="332" y2="576" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="110" y="566" class="msg">2: Lọc theo chuyên khoa, chọn Bác sĩ và xác nhận Chuyên khoa công tác</text>

  <path d="M 348 600 L 394 600 L 394 624 L 354 624" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="404" y="618" class="msg">2.1: filterAvailableDays(existingScheduleDays)</text>

  <!-- ================= PHASE 2: ALT CÒN NGÀY TRỐNG vs ĐỦ 7 NGÀY (Steps 4 - 10, Alt 3.1, 4.1) ================= -->
  <rect x="28" y="652" width="1544" height="1108" class="frag-box"/>
  <polygon points="28,652 92,652 92,676 78,688 28,688" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="46" y="676" class="frag-tag">alt</text>
  <text x="112" y="677" class="guard">[Bác sĩ còn ít nhất 1 ngày trống trong tuần tại nơi công tác đã chọn]</text>

  <line x1="332" y1="726" x2="98" y2="726" class="ret" marker-end="url(#openArrow)"/>
  <text x="110" y="716" class="msg">2.2: Đánh dấu "Đã có" (vô hiệu hóa) các thứ bị trùng và tự chọn sẵn thứ trống đầu tiên</text>

  <line x1="98" y1="782" x2="332" y2="782" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="110" y="772" class="msg">3: Chọn một hoặc nhiều ngày áp dụng trong tuần (Thứ 2 -&gt; Chủ Nhật hoặc nhóm nhanh T2-T6, T2/4/6, T3/5/7, Cả tuần)</text>

  <line x1="98" y1="850" x2="332" y2="850" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="110" y="822" class="msg">4: Chọn khung giờ ca khám (Ca sáng, Ca chiều, Cả ngày hoặc tự nhập), tùy chọn nghỉ giữa ca</text>
  <text x="134" y="840" class="msg">và chọn Trạng thái ca khám</text>

  <line x1="98" y1="912" x2="332" y2="912" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="110" y="902" class="msg">5: Nhấn nút "Tạo ca khám" (hoặc "Tạo N ca khám" khi chọn nhiều ngày)</text>

  <path d="M 348 964 L 394 964 L 394 988 L 354 988" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="404" y="982" class="msg">5.1: validateScheduleForm(workplace, selectedDays, startTime, endTime, breakTime)</text>

  <!-- LOOP: Với từng thứ trong tuần đã chọn -->
  <rect x="44" y="1020" width="1512" height="516" class="frag-box"/>
  <polygon points="44,1020 118,1020 118,1044 104,1056 44,1056" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="61" y="1044" class="frag-tag">loop</text>
  <text x="134" y="1045" class="guard">[Với từng dayOfWeek trong selectedDays]</text>

  <line x1="348" y1="1106" x2="622" y2="1106" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="364" y="1096" class="msg">5.2: createSchedule(workplaceId, data)</text>

  <!-- Dynamic Object Creation: ObjSchedule_new -->
  <line x1="638" y1="1176" x2="865" y2="1176" class="ret" marker-end="url(#openArrow)"/>
  <text x="690" y="1150" class="msg">5.3: &laquo;create&raquo;</text>
  <text x="662" y="1168" class="msg">CreateObjSchedule_new</text>

  <g transform="translate(895, 1176)">
    <circle cx="0" cy="-2" r="20" class="icon-fill"/>
    <line x1="-22" y1="20" x2="22" y2="20" class="icon-stroke"/>
    <text x="0" y="40" class="lifeline-label" style="font-size:14px;">ObjSchedule_new</text>
    <text x="0" y="55" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="895" y1="1238" x2="895" y2="1380" class="lifeline"/>
  <rect x="887" y="1258" width="16" height="28" class="act"/>

  <line x1="887" y1="1274" x2="638" y2="1274" class="ret" marker-end="url(#openArrow)"/>
  <text x="668" y="1264" class="msg">5.4: Trả về ObjSchedule_new</text>

  <line x1="638" y1="1318" x2="1377" y2="1318" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="955" y="1308" class="msg">5.5: create(ObjSchedule_new)</text>

  <path d="M 1393 1340 L 1430 1340 L 1430 1364 L 1399 1364" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="1438" y="1348" class="msg" style="font-size:13.8px;">5.6: Lưu ca</text>
  <text x="1452" y="1366" class="msg" style="font-size:13.8px;">khám mới</text>

  <!-- UML Destruction X for ObjSchedule_new -->
  <line x1="881" y1="1366" x2="909" y2="1394" stroke="#0f172a" stroke-width="2.4"/>
  <line x1="909" y1="1366" x2="881" y2="1394" stroke="#0f172a" stroke-width="2.4"/>

  <line x1="1377" y1="1442" x2="638" y2="1442" class="ret" marker-end="url(#openArrow)"/>
  <text x="935" y="1432" class="msg">5.7: Trả về ca khám định kỳ mới tạo</text>

  <line x1="622" y1="1514" x2="348" y2="1514" class="ret" marker-end="url(#openArrow)"/>
  <text x="364" y="1486" class="msg">5.8: Trả về kết quả tạo</text>
  <text x="396" y="1504" class="msg">ca khám thành công</text>

  <!-- Display Success after Loop (Step 10) -->
  <line x1="332" y1="1604" x2="98" y2="1604" class="ret" marker-end="url(#openArrow)"/>
  <text x="110" y="1576" class="msg">5.9: Đóng hộp thoại, hiển thị thông báo "Đã thêm thành công N ca khám định kỳ"</text>
  <text x="144" y="1594" class="msg">và làm mới bảng danh sách / lịch tuần</text>

  <!-- ELSE của ALT: Bác sĩ đã có đủ lịch cả 7 ngày (Alt 3.1, 4.1) -->
  <line x1="28" y1="1636" x2="1572" y2="1636" class="frag-div"/>
  <text x="112" y="1666" class="guard">[Bác sĩ đã có đủ lịch cả 7 ngày trong tuần tại nơi công tác đã chọn (Alt 3.1, 4.1)]</text>

  <line x1="332" y1="1728" x2="98" y2="1728" class="ret" marker-end="url(#openArrow)"/>
  <text x="110" y="1718" class="msg">2.3: Đánh dấu "Đã có" tất cả 7 nút ngày (vô hiệu hóa) và khóa nút "Tạo ca khám" để tránh trùng lịch</text>
</svg>
