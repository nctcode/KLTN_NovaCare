<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1680" viewBox="0 0 1440 1680">
  <defs>
    <style>
      .lifeline-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .lifeline-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .msg { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .guard { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .frag-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16.5px; font-weight: 800; fill: #0f172a; }
      .lifeline { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .act { fill: #7DD3FC; stroke: #0f172a; stroke-width: 1.6; }
      .arrow { stroke: #0f172a; stroke-width: 2.2px; fill: none; }
      .ret { stroke: #0f172a; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
      .frag-box { fill: none; stroke: #1e293b; stroke-width: 2; }
      .frag-div { stroke: #1e293b; stroke-width: 1.6; stroke-dasharray: 8 5; }
      .icon-fill { fill: #7DD3FC; stroke: #0f172a; stroke-width: 2; }
      .icon-stroke { fill: none; stroke: #0f172a; stroke-width: 2; }
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- White Background -->
  <rect x="0" y="0" width="1440" height="1680" fill="#FFFFFF"/>

  <!-- Frame -->
  <rect x="14" y="14" width="1412" height="1652" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="14,14 445,14 445,46 427,62 14,62" fill="#F1F5F9" stroke="#64748b" stroke-width="1.6"/>
  <text x="30" y="45" class="frag-tag" style="font-size:17.5px;">sd Xem danh sách lịch khám (NovaCare)</text>

  <!-- ================= LIFELINES (4) ================= -->
  <!-- X: Patient=115, GD=465, CTR_Appt=885, E_appointments=1295 -->

  <!-- 1. Actor: Bệnh nhân -->
  <g transform="translate(115, 112)">
    <circle cx="0" cy="-18" r="12" class="icon-fill"/>
    <line x1="0" y1="-6" x2="0" y2="20" class="icon-stroke"/>
    <line x1="-18" y1="3" x2="18" y2="3" class="icon-stroke"/>
    <line x1="0" y1="20" x2="-14" y2="38" class="icon-stroke"/>
    <line x1="0" y1="20" x2="14" y2="38" class="icon-stroke"/>
    <text x="0" y="58" class="lifeline-label">Bệnh nhân</text>
    <text x="0" y="76" class="lifeline-sub">(PATIENT)</text>
  </g>
  <line x1="115" y1="204" x2="115" y2="1645" class="lifeline"/>

  <!-- 2. Boundary: GD_LichKhamCuaToi -->
  <g transform="translate(465, 124)">
    <line x1="-30" y1="-19" x2="-30" y2="19" class="icon-stroke"/>
    <line x1="-30" y1="0" x2="-18" y2="0" class="icon-stroke"/>
    <circle cx="3" cy="0" r="21" class="icon-fill"/>
    <text x="0" y="48" class="lifeline-label">GD_LichKhamCuaToi</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;boundary&gt;&gt;</text>
  </g>
  <line x1="465" y1="204" x2="465" y2="1645" class="lifeline"/>

  <!-- 3. Control: CTR_AppointmentsService -->
  <g transform="translate(885, 124)">
    <circle cx="0" cy="0" r="21" class="icon-fill"/>
    <path d="M -5,-27 L 5,-21 L -5,-15" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="48" class="lifeline-label">CTR_AppointmentsService</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;control&gt;&gt;</text>
  </g>
  <line x1="885" y1="204" x2="885" y2="1645" class="lifeline"/>

  <!-- 4. Entity: E_appointments -->
  <g transform="translate(1295, 124)">
    <circle cx="0" cy="-2" r="21" class="icon-fill"/>
    <line x1="-23" y1="21" x2="23" y2="21" class="icon-stroke"/>
    <text x="0" y="48" class="lifeline-label">E_appointments</text>
    <text x="0" y="68" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="1295" y1="204" x2="1295" y2="1645" class="lifeline"/>

  <!-- ================= ACTIVATION BARS ================= -->
  <!-- Bệnh nhân -->
  <rect x="107" y="228" width="16" height="1386" class="act"/>

  <!-- GD_LichKhamCuaToi -->
  <rect x="457" y="244" width="16" height="1358" class="act"/>

  <!-- CTR_AppointmentsService -->
  <rect x="877" y="294" width="16" height="270" class="act"/>
  <rect x="877" y="1008" width="16" height="270" class="act"/>

  <!-- E_appointments -->
  <rect x="1287" y="346" width="16" height="54" class="act"/>
  <rect x="1287" y="1062" width="16" height="54" class="act"/>

  <!-- ================= PHASE 1: LỊCH KHÁM SẮP TỚI (Steps 1-3, Alt 2.1, 3.1) ================= -->
  <line x1="123" y1="246" x2="457" y2="246" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="138" y="236" class="msg">1: Chọn chức năng "Lịch khám của tôi"</text>

  <line x1="473" y1="296" x2="877" y2="296" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="490" y="286" class="msg">1.1: getUpcoming(userId) [JwtAuthGuard]</text>

  <line x1="893" y1="348" x2="1287" y2="348" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="908" y="330" class="msg">1.2: findMany({ userId, status: upcoming,</text>
  <text x="936" y="368" class="msg">include: slot, patientProfile, doctor, hospital })</text>

  <line x1="1287" y1="400" x2="893" y2="400" class="ret" marker-end="url(#openArrow)"/>
  <text x="1005" y="390" class="msg">1.3: upcomingAppointments[]</text>

  <!-- ALT 1: Kết quả tải lịch sắp tới (Alt 2.1, 3.1) -->
  <rect x="34" y="428" width="1372" height="456" class="frag-box"/>
  <polygon points="34,428 100,428 100,454 86,466 34,466" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="52" y="454" class="frag-tag">alt</text>
  <text x="132" y="455" class="guard">[tải danh sách lịch khám sắp tới thành công]</text>

  <!-- ALT 1.1: Có lịch sắp tới hay không (Alt 3.1) -->
  <rect x="52" y="484" width="1336" height="278" class="frag-box"/>
  <polygon points="52,484 116,484 116,508 102,520 52,520" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="70" y="508" class="frag-tag">alt</text>
  <text x="136" y="509" class="guard">[upcomingAppointments.length &gt; 0]</text>

  <line x1="877" y1="556" x2="473" y2="556" class="ret" marker-end="url(#openArrow)"/>
  <text x="545" y="546" class="msg">1.4: { data: upcomingAppointments }</text>

  <line x1="457" y1="622" x2="123" y2="622" class="ret" marker-end="url(#openArrow)"/>
  <text x="138" y="604" class="msg">1.5: Hiển thị bookingCode, status, specialty,</text>
  <text x="168" y="644" class="msg">patientProfile, doctor, hospital, thời gian khám</text>

  <line x1="52" y1="668" x2="1388" y2="668" class="frag-div"/>
  <text x="136" y="696" class="guard">[không có lịch khám sắp tới (Alt 3.1)]</text>

  <line x1="457" y1="740" x2="123" y2="740" class="ret" marker-end="url(#openArrow)"/>
  <text x="138" y="730" class="msg">1.6: Thông báo chưa có lịch khám &amp; nút "Đặt khám ngay"</text>

  <!-- ELSE của ALT 1: Lỗi tải lịch sắp tới (Alt 2.1) -->
  <line x1="34" y1="786" x2="1406" y2="786" class="frag-div"/>
  <text x="132" y="814" class="guard">[không tải được danh sách lịch sắp tới (Alt 2.1)]</text>

  <line x1="457" y1="860" x2="123" y2="860" class="ret" marker-end="url(#openArrow)"/>
  <text x="138" y="850" class="msg">1.7: Hiển thị lỗi kết nối &amp; nút "Thử lại" (quay lại bước 2)</text>

  <!-- ================= PHASE 2: LỊCH SỬ KHÁM (Steps 4-6, Alt 5.1, 6.1) ================= -->
  <line x1="123" y1="956" x2="457" y2="956" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="138" y="946" class="msg">2: Chọn thẻ "Lịch sử khám"</text>

  <line x1="473" y1="1010" x2="877" y2="1010" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="490" y="1000" class="msg">2.1: getHistory(userId) [JwtAuthGuard]</text>

  <line x1="893" y1="1064" x2="1287" y2="1064" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="908" y="1046" class="msg">2.2: findMany({ userId, status ∈ { COMPLETED,</text>
  <text x="936" y="1084" class="msg">CANCELLED, EXPIRED, NO_SHOW }, orderBy: desc })</text>

  <line x1="1287" y1="1116" x2="893" y2="1116" class="ret" marker-end="url(#openArrow)"/>
  <text x="1015" y="1106" class="msg">2.3: historyAppointments[]</text>

  <!-- ALT 2: Kết quả tải lịch sử khám (Alt 5.1, 6.1) -->
  <rect x="34" y="1144" width="1372" height="454" class="frag-box"/>
  <polygon points="34,1144 100,1144 100,1170 86,1182 34,1182" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="52" y="1170" class="frag-tag">alt</text>
  <text x="132" y="1171" class="guard">[tải danh sách lịch sử khám thành công]</text>

  <!-- ALT 2.1: Có lịch sử khám hay không (Alt 6.1) -->
  <rect x="52" y="1200" width="1336" height="276" class="frag-box"/>
  <polygon points="52,1200 116,1200 116,1224 102,1236 52,1236" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="70" y="1224" class="frag-tag">alt</text>
  <text x="136" y="1225" class="guard">[historyAppointments.length &gt; 0]</text>

  <line x1="877" y1="1272" x2="473" y2="1272" class="ret" marker-end="url(#openArrow)"/>
  <text x="550" y="1262" class="msg">2.4: { data: historyAppointments }</text>

  <line x1="457" y1="1334" x2="123" y2="1334" class="ret" marker-end="url(#openArrow)"/>
  <text x="138" y="1324" class="msg">2.5: Hiển thị danh sách lịch sử khám theo thời gian (chỉ đọc)</text>

  <line x1="52" y1="1382" x2="1388" y2="1382" class="frag-div"/>
  <text x="136" y="1410" class="guard">[chưa có lịch sử khám (Alt 6.1)]</text>

  <line x1="457" y1="1454" x2="123" y2="1454" class="ret" marker-end="url(#openArrow)"/>
  <text x="138" y="1444" class="msg">2.6: Hiển thị thông báo chưa có lịch sử khám bệnh</text>

  <!-- ELSE của ALT 2: Lỗi tải lịch sử khám (Alt 5.1) -->
  <line x1="34" y1="1500" x2="1406" y2="1500" class="frag-div"/>
  <text x="132" y="1528" class="guard">[không tải được lịch sử khám (Alt 5.1)]</text>

  <line x1="457" y1="1574" x2="123" y2="1574" class="ret" marker-end="url(#openArrow)"/>
  <text x="138" y="1564" class="msg">2.7: Hiển thị lỗi kết nối &amp; nút "Thử lại" (quay lại bước 5)</text>
</svg>
