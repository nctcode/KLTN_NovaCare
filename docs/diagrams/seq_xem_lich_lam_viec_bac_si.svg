<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="2020" viewBox="0 0 1520 2020">
  <defs>
    <style>
      .lifeline-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .lifeline-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.8px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .msg { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.2px; font-weight: 600; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .guard { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15.2px; font-weight: 800; fill: #0f172a; paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
      .frag-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; }
      .lifeline { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .act { fill: #7DD3FC; stroke: #0f172a; stroke-width: 1.6; }
      .arrow { stroke: #0f172a; stroke-width: 2px; fill: none; }
      .ret { stroke: #0f172a; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
      .frag-box { fill: none; stroke: #1e293b; stroke-width: 2; }
      .frag-div { stroke: #1e293b; stroke-width: 1.6; stroke-dasharray: 8 5; }
      .icon-fill { fill: #7DD3FC; stroke: #0f172a; stroke-width: 2; }
      .icon-stroke { fill: none; stroke: #0f172a; stroke-width: 2; }
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- White Background -->
  <rect x="0" y="0" width="1520" height="2020" fill="#FFFFFF"/>

  <!-- Frame -->
  <rect x="14" y="14" width="1492" height="1992" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="14,14 480,14 480,46 462,62 14,62" fill="#F1F5F9" stroke="#64748b" stroke-width="1.6"/>
  <text x="30" y="45" class="frag-tag" style="font-size:17px;">sd Xem lịch làm việc và ca trực (NovaCare)</text>

  <!-- ================= LIFELINES (6) ================= -->
  <!-- X: Doctor=95, GD=355, CTR_DoctorPortal=660, E_doctors=935, E_schedules=1175, E_slots=1405 -->

  <!-- 1. Actor: Bác sĩ -->
  <g transform="translate(95, 112)">
    <circle cx="0" cy="-18" r="12" class="icon-fill"/>
    <line x1="0" y1="-6" x2="0" y2="20" class="icon-stroke"/>
    <line x1="-18" y1="3" x2="18" y2="3" class="icon-stroke"/>
    <line x1="0" y1="20" x2="-14" y2="38" class="icon-stroke"/>
    <line x1="0" y1="20" x2="14" y2="38" class="icon-stroke"/>
    <text x="0" y="58" class="lifeline-label">Bác sĩ</text>
    <text x="0" y="75" class="lifeline-sub">(DOCTOR)</text>
  </g>
  <line x1="95" y1="204" x2="95" y2="1985" class="lifeline"/>

  <!-- 2. Boundary: GD_LichTrucBacSi -->
  <g transform="translate(355, 124)">
    <line x1="-30" y1="-19" x2="-30" y2="19" class="icon-stroke"/>
    <line x1="-30" y1="0" x2="-18" y2="0" class="icon-stroke"/>
    <circle cx="3" cy="0" r="21" class="icon-fill"/>
    <text x="0" y="48" class="lifeline-label">GD_LichTrucBacSi</text>
    <text x="0" y="66" class="lifeline-sub">&lt;&lt;boundary&gt;&gt;</text>
  </g>
  <line x1="355" y1="204" x2="355" y2="1985" class="lifeline"/>

  <!-- 3. Control: CTR_DoctorPortalService -->
  <g transform="translate(660, 124)">
    <circle cx="0" cy="0" r="21" class="icon-fill"/>
    <path d="M -5,-27 L 5,-21 L -5,-15" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="45" class="lifeline-label" style="font-size:15px;">CTR_DoctorPortal</text>
    <text x="0" y="62" class="lifeline-label" style="font-size:15px;">Service</text>
    <text x="0" y="78" class="lifeline-sub">&lt;&lt;control&gt;&gt;</text>
  </g>
  <line x1="660" y1="204" x2="660" y2="1985" class="lifeline"/>

  <!-- 4. Entity: E_doctors -->
  <g transform="translate(935, 124)">
    <circle cx="0" cy="-2" r="21" class="icon-fill"/>
    <line x1="-23" y1="21" x2="23" y2="21" class="icon-stroke"/>
    <text x="0" y="48" class="lifeline-label">E_doctors</text>
    <text x="0" y="66" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="935" y1="204" x2="935" y2="1985" class="lifeline"/>

  <!-- 5. Entity: E_doctor_schedules -->
  <g transform="translate(1175, 124)">
    <circle cx="0" cy="-2" r="21" class="icon-fill"/>
    <line x1="-23" y1="21" x2="23" y2="21" class="icon-stroke"/>
    <text x="0" y="45" class="lifeline-label" style="font-size:15px;">E_doctor_</text>
    <text x="0" y="62" class="lifeline-label" style="font-size:15px;">schedules</text>
    <text x="0" y="78" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="1175" y1="204" x2="1175" y2="1985" class="lifeline"/>

  <!-- 6. Entity: E_appointment_slots -->
  <g transform="translate(1405, 124)">
    <circle cx="0" cy="-2" r="21" class="icon-fill"/>
    <line x1="-23" y1="21" x2="23" y2="21" class="icon-stroke"/>
    <text x="0" y="45" class="lifeline-label" style="font-size:15px;">E_appointment_</text>
    <text x="0" y="62" class="lifeline-label" style="font-size:15px;">slots</text>
    <text x="0" y="78" class="lifeline-sub">&lt;&lt;entity&gt;&gt;</text>
  </g>
  <line x1="1405" y1="204" x2="1405" y2="1985" class="lifeline"/>

  <!-- ================= ACTIVATION BARS ================= -->
  <!-- Bác sĩ -->
  <rect x="87" y="228" width="16" height="1730" class="act"/>

  <!-- GD_LichTrucBacSi -->
  <rect x="347" y="242" width="16" height="1704" class="act"/>
  <rect x="355" y="268" width="14" height="24" class="act"/>

  <!-- CTR_DoctorPortalService -->
  <rect x="652" y="330" width="16" height="444" class="act"/>
  <rect x="652" y="1604" width="16" height="226" class="act"/>

  <!-- E_doctors -->
  <rect x="927" y="446" width="16" height="46" class="act"/>

  <!-- E_doctor_schedules -->
  <rect x="1167" y="538" width="16" height="46" class="act"/>
  <rect x="1167" y="1648" width="16" height="46" class="act"/>

  <!-- E_appointment_slots -->
  <rect x="1397" y="630" width="16" height="46" class="act"/>
  <rect x="1397" y="1736" width="16" height="46" class="act"/>

  <!-- ================= PHASE 1: TẢI LỊCH TUẦN HIỆN TẠI (Steps 1-4, Alt 2.1, 2.2, 3.1, 4.1) ================= -->
  <line x1="103" y1="244" x2="347" y2="244" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="116" y="235" class="msg">1: Chọn chức năng "Lịch trực"</text>

  <path d="M 363 264 L 408 264 L 408 288 L 369 288" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="418" y="282" class="msg">1.1: getCurrentWeekRange() (Thứ Hai – Chủ nhật: startDate, endDate)</text>

  <line x1="363" y1="332" x2="652" y2="332" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="376" y="323" class="msg">1.2: getSchedules(userId, startDate, endDate) [JwtAuthGuard, RolesGuard]</text>

  <!-- ALT 1: Phiên đăng nhập & Kết nối (Alt 2.1, 2.2) -->
  <rect x="28" y="366" width="1464" height="1062" class="frag-box"/>
  <polygon points="28,366 92,366 92,390 78,402 28,402" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="46" y="390" class="frag-tag">alt</text>
  <text x="114" y="391" class="guard">[JWT hợp lệ, role == "DOCTOR", hồ sơ hoạt động &amp;&amp; kết nối thành công]</text>

  <line x1="668" y1="448" x2="927" y2="448" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="682" y="439" class="msg">1.3: getDoctorOrThrow(userId) [workPlaces]</text>

  <line x1="927" y1="492" x2="668" y2="492" class="ret" marker-end="url(#openArrow)"/>
  <text x="740" y="483" class="msg">1.4: doctor, workplaceIds</text>

  <line x1="668" y1="540" x2="1167" y2="540" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="682" y="531" class="msg">1.5: findMany({ doctorWorkplaceId ∈ workplaceIds, isActive: true })</text>

  <line x1="1167" y1="584" x2="668" y2="584" class="ret" marker-end="url(#openArrow)"/>
  <text x="860" y="575" class="msg">1.6: recurringSchedules[]</text>

  <line x1="668" y1="632" x2="1397" y2="632" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="682" y="623" class="msg">1.7: findMany({ doctorWorkplaceId ∈ workplaceIds, startTime ∈ [from..to], _count: primaryAppointments })</text>

  <line x1="1397" y1="676" x2="668" y2="676" class="ret" marker-end="url(#openArrow)"/>
  <text x="980" y="667" class="msg">1.8: slots[] (roomSession.room, maxPatients, bookedCount)</text>

  <line x1="652" y1="752" x2="363" y2="752" class="ret" marker-end="url(#openArrow)"/>
  <text x="376" y="743" class="msg">1.9: { data: { recurringSchedules, slots } }</text>

  <!-- ALT 1.1: Hiển thị ca trực / lịch lặp lại / rỗng (Alt 3.1, 4.1) -->
  <rect x="44" y="786" width="1432" height="444" class="frag-box"/>
  <polygon points="44,786 106,786 106,808 92,820 44,820" fill="#F1F5F9" stroke="#1e293b" stroke-width="1.6"/>
  <text x="61" y="809" class="frag-tag">alt</text>
  <text x="118" y="810" class="guard">[slots.length &gt; 0 (có ca trực cụ thể trong tuần)]</text>

  <line x1="347" y1="868" x2="103" y2="868" class="ret" marker-end="url(#openArrow)"/>
  <text x="116" y="851" class="msg">1.10: Hiển thị khoảng ngày tuần &amp; danh sách ca trực theo thứ tự thời gian</text>
  <text x="150" y="888" class="msg">(giờ ca, phòng khám/cơ sở, chuyên khoa, số lịch hẹn / sức chứa)</text>

  <line x1="44" y1="924" x2="1476" y2="924" class="frag-div"/>
  <text x="118" y="950" class="guard">[slots.length == 0 &amp;&amp; recurringSchedules.length &gt; 0 (Alt 4.1)]</text>

  <line x1="347" y1="1008" x2="103" y2="1008" class="ret" marker-end="url(#openArrow)"/>
  <text x="116" y="999" class="msg">1.11: Hiển thị thứ (dayOfWeek), giờ bắt đầu, giờ kết thúc &amp; cơ sở từ lịch lặp lại</text>

  <line x1="44" y1="1064" x2="1476" y2="1064" class="frag-div"/>
  <text x="118" y="1090" class="guard">[tuần được chọn không có ca trực hoặc lịch làm việc (Alt 3.1)]</text>

  <line x1="347" y1="1152" x2="103" y2="1152" class="ret" marker-end="url(#openArrow)"/>
  <text x="116" y="1143" class="msg">1.12: Hiển thị thông báo "Không có ca trực trong tuần"</text>

  <!-- ELSE 1: Hết hạn phiên / không có quyền (Alt 2.1) -->
  <line x1="28" y1="1250" x2="1492" y2="1250" class="frag-div"/>
  <text x="114" y="1276" class="guard">[phiên đăng nhập hết hạn hoặc không còn quyền truy cập - 401/403 (Alt 2.1)]</text>

  <line x1="347" y1="1318" x2="103" y2="1318" class="ret" marker-end="url(#openArrow)"/>
  <text x="116" y="1309" class="msg">1.13: Chuyển về màn hình đăng nhập (kết thúc use case)</text>

  <!-- ELSE 2: Mất kết nối / lỗi máy chủ (Alt 2.2) -->
  <line x1="28" y1="1338" x2="1492" y2="1338" class="frag-div"/>
  <text x="114" y="1364" class="guard">[không thể tải lịch do mất kết nối hoặc lỗi máy chủ (Alt 2.2)]</text>

  <line x1="347" y1="1408" x2="103" y2="1408" class="ret" marker-end="url(#openArrow)"/>
  <text x="116" y="1399" class="msg">1.14: Hiển thị thông báo lỗi &amp; nút "Thử lại" (quay lại bước 2)</text>

  <!-- ================= PHASE 2: CHUYỂN TUẦN TRƯỚC / TUẦN SAU & XEM (Steps 5-7) ================= -->
  <line x1="103" y1="1544" x2="347" y2="1544" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="116" y="1535" class="msg">2: Nhấn mũi tên chọn tuần trước / tuần sau (newStartDate, newEndDate)</text>

  <line x1="363" y1="1606" x2="652" y2="1606" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="376" y="1597" class="msg">2.1: getSchedules(userId, newStartDate, newEndDate)</text>

  <line x1="668" y1="1650" x2="1167" y2="1650" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="682" y="1641" class="msg">2.2: findMany({ doctorWorkplaceId, effectiveFrom/To })</text>

  <line x1="1167" y1="1694" x2="668" y2="1694" class="ret" marker-end="url(#openArrow)"/>
  <text x="860" y="1685" class="msg">2.3: recurringSchedules[]</text>

  <line x1="668" y1="1738" x2="1397" y2="1738" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="682" y="1729" class="msg">2.4: findMany({ doctorWorkplaceId, startTime ∈ [newFrom..newTo] })</text>

  <line x1="1397" y1="1782" x2="668" y2="1782" class="ret" marker-end="url(#openArrow)"/>
  <text x="980" y="1773" class="msg">2.5: slots[]</text>

  <line x1="652" y1="1828" x2="363" y2="1828" class="ret" marker-end="url(#openArrow)"/>
  <text x="376" y="1819" class="msg">2.6: { data: { recurringSchedules, slots } }</text>

  <line x1="347" y1="1882" x2="103" y2="1882" class="ret" marker-end="url(#openArrow)"/>
  <text x="116" y="1873" class="msg">2.7: Hiển thị lịch làm việc &amp; ca trực của tuần được chọn</text>

  <line x1="103" y1="1940" x2="347" y2="1940" class="arrow" marker-end="url(#solidArrow)"/>
  <text x="116" y="1931" class="msg">3: Xem thông tin ca trực (chỉ đọc, không thay đổi phân công)</text>
</svg>
