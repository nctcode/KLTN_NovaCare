services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: novacare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova_care
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nova_care']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novacare_network

  # ── NestJS Backend API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: novacare_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nova_care?schema=public
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_BASE_URL: https://platform.beeknoee.com/api/v1
      OPENAI_API_KEY: sk-bee-24090705ac27bb4c3fb277e4263409a982db7568a3feb77029cc287a5578d9be
      OPENAI_MODEL_CHAT: gpt-5.4
      OPENAI_MODEL_VISION: gpt-5.4
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - novacare_network
    command: npm run start:dev

  # ── Prisma Studio (tuỳ chọn) ─────────────────────────────────────────
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: novacare_prisma_studio
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nova_care?schema=public
    ports:
      - '5555:5555'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novacare_network
    command: npx prisma studio --port 5555 --browser none
    profiles:
      - tools

  # ── Redis Server ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: novacare_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    networks:
      - novacare_network

volumes:
  postgres_data:
    name: novacare_postgres_data
  redis_data:
    name: novacare_redis_data

networks:
  novacare_network:
    name: novacare_network
    driver: bridge
